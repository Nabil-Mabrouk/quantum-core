[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quantum-st"
version = "0.1.0"
description = "Modélisation systémique des flux hydrauliques et chimiques en traitement de surface"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Votre Nom", email = "email@example.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Manufacturing",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "networkx>=2.6.0",
    "pandas>=1.3.0",
    "pydantic>=2.0.0",
    "matplotlib>=3.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "black>=22.0.0",
    "mypy>=0.950",
    "sphinx>=4.5.0",
]